esphome:
  name: vmc-khrv
  friendly_name: VMC KHR-V

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: INFO

api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

globals:
  # ultimo codice velocita visto dal tastierino (-1 = nessuno)
  - id: last_panel_code
    type: int
    initial_value: "-1"
  # Contatore filtri: minuti in RAM, ore persistite in flash
  - id: filter_minutes
    type: int
    initial_value: "0"
  - id: filter_hours
    type: int
    restore_value: true
    initial_value: "0"

# Conta le ore con il motore acceso (una scrittura in flash all'ora)
interval:
  - interval: 60s
    then:
      - lambda: |-
          if (id(motor_speed).has_state() && id(motor_speed).state > 0) {
            id(filter_minutes) += 1;
            if (id(filter_minutes) >= 60) {
              id(filter_minutes) = 0;
              id(filter_hours) += 1;
            }
          }

# ---------------------------------------------------------------
# Giacomini KHR-V (scheda INN-FR-B40) su Modbus ASCII 9600 7E1.
# Scheda slave all'indirizzo 1, pannello CNV collegato e funzionante,
# jumper RTU/ASCII fuori posizione.
#
# Letture: FC03 dirette alla scheda.
# Comandi: emulazione del broadcast FC16 del pannello (reg 101-103).
#   reg 101 nibble basso = velocita (0 auto, 2 min, 1 nom, 3 max, 4 booster)
#   reg 102 = setpoint x10
#   reg 103 = temperatura del pannello (lasciata invariata)
#
# Logica di convivenza con il tastierino (tutta nel firmware):
#   - un comando da HA (velocita o setpoint) accende il controllo HA
#   - un tasto premuto sul tastierino spegne il controllo HA
#
# Contatore filtri nel firmware: il contatore della scheda (reg 222)
# resta a zero finche' ACL (reg 221) e' 0. Qui si contano le ore con
# motore acceso; oltre la soglia scatta "Cambio filtri" e una notifica
# in HA (richiede "Consenti azioni HA" nell'integrazione ESPHome).
#
# A e B sono attualmente invertiti sulla Waveshare: le due
# "inverted: true" compensano. Scambiando i fili vanno rimosse.
# ---------------------------------------------------------------

external_components:
  - source:
      type: git
      url: https://github.com/automjordan/esphome-modbus-ascii
      ref: main
    refresh: 1d

uart:
  id: bus485
  tx_pin:
    number: GPIO17
    inverted: true
  rx_pin:
    number: GPIO18
    inverted: true
  baud_rate: 9600
  data_bits: 7
  parity: EVEN
  stop_bits: 1

modbus_ascii:
  id: vmc
  uart_id: bus485
  address: 1
  flow_control_pin: GPIO21
  update_interval: 15s
  command_throttle: 150ms
  response_timeout: 500ms

# ---------------------------------------------------------------
# Letture dalla scheda
# ---------------------------------------------------------------

sensor:
  - platform: modbus_ascii
    modbus_ascii_id: vmc
    name: "Temperatura aria"
    register: 0
    signed: true
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_ascii
    modbus_ascii_id: vmc
    name: "Temperatura T2"
    register: 1
    signed: true
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_ascii
    modbus_ascii_id: vmc
    name: "Temperatura T3"
    register: 2
    signed: true
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_ascii
    modbus_ascii_id: vmc
    name: "Setpoint attivo"
    register: 8
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_ascii
    modbus_ascii_id: vmc
    name: "Velocita ventilatore"
    id: motor_speed
    register: 15
    unit_of_measurement: "%"
    icon: mdi:fan
    state_class: measurement
    accuracy_decimals: 0

  - platform: modbus_ascii
    modbus_ascii_id: vmc
    name: "Ore lavoro ventilatore"
    register: 222
    unit_of_measurement: "h"
    state_class: total_increasing
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: template
    name: "Ore filtri"
    id: filter_hours_sensor
    icon: mdi:air-filter
    unit_of_measurement: "h"
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: 60s
    lambda: 'return id(filter_hours);'

  - platform: modbus_ascii
    modbus_ascii_id: vmc
    id: stat_raw
    name: "STAT grezzo"
    register: 104
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: modbus_ascii
    modbus_ascii_id: vmc
    id: alr_raw
    name: "Allarmi grezzo"
    register: 105
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: modbus_ascii
    modbus_ascii_id: vmc
    name: "Stagionale grezzo"
    register: 233
    accuracy_decimals: 0
    entity_category: diagnostic
    on_value:
      then:
        - lambda: |-
            const char *m = "Automatico";
            if ((int) x == 3) m = "Inverno";
            else if ((int) x == 5) m = "Estate";
            id(vmc_season).publish_state(m);

  # Tabella velocita della scheda, sola lettura
  - platform: modbus_ascii
    modbus_ascii_id: vmc
    name: "MVV5 minima"
    register: 210
    unit_of_measurement: "%"
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: modbus_ascii
    modbus_ascii_id: vmc
    name: "MVV4 nominale"
    register: 211
    unit_of_measurement: "%"
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: modbus_ascii
    modbus_ascii_id: vmc
    name: "MVV3 auto min"
    register: 212
    unit_of_measurement: "%"
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: modbus_ascii
    modbus_ascii_id: vmc
    name: "MVV2 massima"
    register: 213
    unit_of_measurement: "%"
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: modbus_ascii
    modbus_ascii_id: vmc
    name: "MVV1 booster"
    register: 214
    unit_of_measurement: "%"
    accuracy_decimals: 0
    entity_category: diagnostic

  # Broadcast del pannello: solo ascolto
  - platform: modbus_ascii
    modbus_ascii_id: vmc
    id: panel_101
    name: "Pannello reg 101"
    register: 101
    passive: true
    accuracy_decimals: 0
    entity_category: diagnostic
    on_value:
      then:
        - lambda: |-
            uint8_t code = ((uint16_t) x) & 0x0F;
            const char *m = "Sconosciuta";
            switch (code) {
              case 0: m = "Automatico"; break;
              case 2: m = "Minima";     break;
              case 1: m = "Nominale";   break;
              case 3: m = "Massima";    break;
              case 4: m = "Booster";    break;
            }
            id(panel_mode_text).publish_state(m);

            // Tasto premuto sul tastierino: il pannello riprende il comando.
            if (id(last_panel_code) >= 0 && code != id(last_panel_code)
                && id(vmc).get_override()) {
              ESP_LOGI("HA", "Tastierino -> %s: restituisco il comando al pannello", m);
              id(vmc_override).turn_off();
            }
            id(last_panel_code) = code;

  - platform: modbus_ascii
    modbus_ascii_id: vmc
    name: "Pannello setpoint"
    register: 102
    passive: true
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    entity_category: diagnostic
    filters:
      - multiply: 0.1

  - platform: modbus_ascii
    modbus_ascii_id: vmc
    name: "Pannello temperatura"
    register: 103
    passive: true
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    entity_category: diagnostic
    filters:
      - multiply: 0.1

text_sensor:
  - platform: template
    name: "Velocita richiesta dal tastierino"
    id: panel_mode_text
    icon: mdi:remote

# ---------------------------------------------------------------
# Allarmi e stato
# ---------------------------------------------------------------

binary_sensor:
  - platform: template
    name: "Allarme comunicazione"
    lambda: 'return ((uint16_t) id(alr_raw).state) & 0x0001;'
    device_class: problem

  - platform: template
    name: "Allarme sonda aria"
    lambda: 'return ((uint16_t) id(alr_raw).state) & 0x0002;'
    device_class: problem

  - platform: template
    name: "Allarme sonda H4"
    lambda: 'return ((uint16_t) id(alr_raw).state) & 0x0004;'
    device_class: problem

  - platform: template
    name: "Allarme sonda H2"
    lambda: 'return ((uint16_t) id(alr_raw).state) & 0x0010;'
    device_class: problem

  - platform: template
    name: "Guasto motore"
    lambda: 'return ((uint16_t) id(alr_raw).state) & 0x0080;'
    device_class: problem

  - platform: template
    name: "Filtri sporchi"
    lambda: 'return ((uint16_t) id(alr_raw).state) & 0x0400;'
    device_class: problem

  - platform: template
    name: "Modo raffrescamento"
    lambda: 'return ((uint16_t) id(stat_raw).state) & 0x0001;'

  - platform: template
    name: "Modo riscaldamento"
    lambda: 'return ((uint16_t) id(stat_raw).state) & 0x0002;'

  - platform: template
    name: "Antigelo attivo"
    lambda: 'return ((uint16_t) id(stat_raw).state) & 0x0010;'

  - platform: template
    name: "Allarme presente"
    lambda: 'return ((uint16_t) id(stat_raw).state) & 0x0020;'
    device_class: problem

  - platform: template
    name: "Cambio filtri"
    id: filter_due
    device_class: problem
    icon: mdi:air-filter
    lambda: 'return id(filter_hours) >= (int) id(filter_interval).state;'
    on_press:
      then:
        - homeassistant.service:
            service: persistent_notification.create
            data:
              notification_id: vmc_filtri
              title: "VMC: cambio filtri"
              message: "La VMC ha superato le ore previste. Dopo la sostituzione premi 'Filtri sostituiti'."

# ---------------------------------------------------------------
# Comandi
# ---------------------------------------------------------------

switch:
  - platform: template
    name: "Controllo da Home Assistant"
    id: vmc_override
    icon: mdi:home-assistant
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: 'id(vmc).set_override(true);'
    turn_off_action:
      - lambda: 'id(vmc).set_override(false);'

select:
  - platform: template
    name: "Velocita ventilazione"
    id: vmc_speed
    icon: mdi:fan
    options:
      - "Automatico"
      - "Minima"
      - "Nominale"
      - "Massima"
      - "Booster"
    optimistic: true
    restore_value: true
    initial_option: "Automatico"
    set_action:
      - lambda: |-
          uint8_t code = 0;
          if (x == "Minima") code = 2;
          else if (x == "Nominale") code = 1;
          else if (x == "Massima") code = 3;
          else if (x == "Booster") code = 4;
          ESP_LOGI("HA", "Velocita -> %s (codice %u)", x.c_str(), code);
          id(vmc).set_desired_mode(code);
          id(vmc_override).turn_on();
          id(vmc).send_panel_frame(true);

  - platform: template
    name: "Stagionale"
    id: vmc_season
    options: ["Automatico", "Inverno", "Estate"]
    optimistic: false
    set_action:
      - lambda: |-
          uint16_t v = 0;
          if (x == "Inverno") v = 3;
          else if (x == "Estate") v = 5;
          ESP_LOGI("HA", "Stagionale -> %s: scrivo reg 233 = %u", x.c_str(), v);
          id(vmc).write_register(233, v);

number:
  - platform: template
    name: "Setpoint"
    id: vmc_setpoint
    icon: mdi:thermometer
    min_value: 16
    max_value: 28
    step: 0.5
    unit_of_measurement: "°C"
    optimistic: true
    restore_value: true
    initial_value: 22
    set_action:
      - lambda: |-
          uint16_t v = (uint16_t) lroundf(x * 10.0f);
          ESP_LOGI("HA", "Setpoint -> %.1f (reg 102 = %u)", x, v);
          id(vmc).set_desired_setpoint(v);
          id(vmc_override).turn_on();
          id(vmc).send_panel_frame(true);

  - platform: template
    name: "Intervallo cambio filtri"
    id: filter_interval
    icon: mdi:calendar-clock
    min_value: 1000
    max_value: 20000
    step: 100
    unit_of_measurement: "h"
    optimistic: true
    restore_value: true
    initial_value: 8760
    entity_category: config

button:
  - platform: template
    name: "Filtri sostituiti"
    icon: mdi:air-filter
    entity_category: config
    on_press:
      - lambda: |-
          id(filter_hours) = 0;
          id(filter_minutes) = 0;
          id(vmc).write_register(222, 0);
          ESP_LOGI("HA", "Filtri sostituiti: contatore azzerato");
      - homeassistant.service:
          service: persistent_notification.dismiss
          data:
            notification_id: vmc_filtri
